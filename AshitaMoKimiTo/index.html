<!doctype html>
<!--
  画面の土台となるHTMLです。
  本文・探索項目は data.js、進行は app.js、見た目は style.css で編集します。
-->
<!DOCTYPE html>
<!-- 日本語のシナリオページ -->
<html lang="ja">
 <head>
  <!-- 文字コード・スマホ表示・ページ情報 -->
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="#141923" name="theme-color"/>
  <title>
   明日も君と｜神狩荘 常設シナリオ
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <!-- アプリの外枠とタイトル -->
  <div class="shell">
   <header>
    <span class="eyebrow">
     神狩荘｜二人で読む常設探索シナリオ
    </span>
    <h1>
     明日も君と
    </h1>
    <p class="tagline">
     永遠ではなく、明日を。
    </p>
   </header>
   <!-- JavaScript が現在のシーンをここへ描画します -->
   <main aria-live="polite" id="app">
   </main>
   <footer>
    自由なRPを優先してください。判定・ダイスなし／一組・一端末／自動セーブ
   </footer>
  </div>
  <!-- シナリオ本文を先に読み込みます -->
  <script src="data.js">
  </script>
  <!-- 画面描画・選択処理を読み込みます -->
  <script src="app.js">
  </script>
 </body>
</html>
